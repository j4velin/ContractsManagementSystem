<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/header :: nav('contracts')}"></nav>
<main role="main" class="container" style="max-width: 330px;">
    <!--/* contractForm: the ContractForm, contractId: the id of the edited contract, not set when adding one */-->
    <form th:action="${contractId} ? @{/contracts/{id}(id=${contractId})} : @{/contracts}" th:object="${contractForm}"
          method="post" class="needs-validation" novalidate>
        <h1 class="h3 mb-4 fw-normal" th:text="${contractId} ? #{contract.action.edit} : #{contract.action.add}">Edit contract</h1>
        <div class="mb-3">
            <label for="type" class="form-label" th:text="#{contract.type}">Type</label>
            <input type="text" class="form-control" id="type" th:field="*{type}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>
        <div class="mb-3">
            <label for="company" class="form-label" th:text="#{contract.company}">Company</label>
            <input type="text" class="form-control" id="company" th:field="*{company}" th:errorclass="is-invalid"
                   required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></div>
        </div>
        <div class="mb-3">
            <label for="notes" class="form-label" th:text="#{contract.notes}">Notes</label>
            <textarea class="form-control" id="notes" th:field="*{notes}"></textarea>
        </div>
        <div class="mb-3">
            <label for="startDate" class="form-label" th:text="#{contract.startDate}">Start date</label>
            <input id="startDate" class="form-control" type="date" th:field="*{startDate}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
        </div>
        <div class="accordion mb-3" th:with="expanded=*{hasCancellationInput()}">
            <div class="accordion-item">
                <h2 class="accordion-header" id="cancelHeader">
                    <button class="accordion-button" th:classappend="${expanded} ? 'show' : 'collapsed'"
                            type="button" data-bs-toggle="collapse"
                            data-bs-target="#cancelBody"
                            th:attr="aria-expanded=${expanded}"
                            aria-controls="cancelBody"  th:text="#{contract.cancellation}">
                        Cancellation
                    </button>
                </h2>
                <div id="cancelBody"
                     class="accordion-collapse"
                     th:classappend="${expanded} ? 'show' : 'collapse'"
                     aria-labelledby="cancelHeader">
                    <div class="accordion-body">
                        <div th:replace="~{fragments/components :: period(#{contract.cancellation.minDuration}, 'minDuration')}">
                        </div>
                        <div th:replace="~{fragments/components :: period(#{contract.cancellation.extensionPeriod}, 'extendPeriod')}">
                        </div>
                        <div th:replace="~{fragments/components :: period(#{contract.cancellation.noticePeriod}, 'noticePeriod')}">
                        </div>
                        <div class="mb-3">
                            <input class="form-check-input" type="checkbox" id="canceled" th:field="*{canceled}">
                            <label class="form-check-label" for="canceled" th:text="#{contract.canceled}">Canceled</label>
                        </div>
                        <div class="mb-3">
                            <input class="form-check-input" type="checkbox" id="cancelAck" th:field="*{cancelAck}">
                            <label class="form-check-label" for="cancelAck" th:text="#{contract.cancellation.ack}">Cancellation acknowledged</label>
                        </div>
                        <div class="mb-3">
                            <label for="endDate" class="form-label" th:text="#{contract.endDate}">End date</label>
                            <input id="endDate" class="form-control" type="date" th:field="*{endDate}"
                                   th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="accordion mb-3" th:with="expanded=*{hasBonusInput()}">
            <div class="accordion-item">
                <h2 class="accordion-header" id="bonusHeader">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            th:classappend="${expanded} ? 'show' : 'collapsed'"
                            data-bs-target="#bonusBody"
                            th:attr="aria-expanded=${expanded}"
                            aria-controls="bonusBody" th:text="#{contract.bonus}">
                        Bonus / Reward
                    </button>
                </h2>
                <div id="bonusBody" class="accordion-collapse"
                     th:classappend="${expanded} ? 'show' : 'collapse'"
                     aria-labelledby="bonusHeader">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label for="bonusDescription" class="form-label" th:text="#{contract.bonus.description}">Description</label>
                            <textarea class="form-control" id="bonusDescription" th:field="*{bonusDescription}"></textarea>
                        </div>
                        <div class="mb-3">
                            <input class="form-check-input" type="checkbox" id="bonusReceived" th:field="*{bonusReceived}">
                            <label class="form-check-label" for="bonusReceived" th:text="#{contract.bonus.received}">Bonus received</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="w-100">
            <input type="submit" th:value="#{action.save}" class="btn btn-primary mt-3"/>
            <button th:if="${contractId}" type="submit" form="deleteForm" class="btn btn-outline-danger mt-3 float-end"
                    th:text="#{action.delete}" th:data-confirm="#{contract.action.delete.confirm}">Delete</button>
        </div>
    </form>
    <form th:if="${contractId}" id="deleteForm" method="post" th:action="@{/contracts/{id}/delete(id=${contractId})}"></form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
