<!--/* period: the two form fields of a period of the enclosing th:object (a ContractForm): "<id>Value", the number of
     units, and "<id>Unit", one of D, W, M or Y. ContractForm prefills them from a stored period */-->
<div xmlns:th="http://www.thymeleaf.org" class="mb-3" th:fragment="period(label, id)">
    <label th:for="${id}" class="form-label" th:text="${label}"></label>
    <div class="input-group has-validation mb-3">
        <input type="number" class="form-control" th:id="${id}" th:field="*{__${id}__Value}"
               th:errorclass="is-invalid" size="3" min="0" max="999" step="1">
        <select class="form-select" th:id="${id} + 'Unit'" th:field="*{__${id}__Unit}" th:errorclass="is-invalid">
            <option value="" th:text="#{form.choose}">Choose...</option>
            <option value="D" th:text="#{form.duration.days}">days</option>
            <option value="W" th:text="#{form.duration.weeks}">weeks</option>
            <option value="M" th:text="#{form.duration.months}">months</option>
            <option value="Y" th:text="#{form.duration.years}">years</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(id + 'Value')}" th:errors="*{__${id}__Value}"></div>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(id + 'Unit')}" th:errors="*{__${id}__Unit}"></div>
    </div>
</div>
