<div xmlns:th="http://www.thymeleaf.org" th:fragment="formvalidation">
    <script>
    (function () {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        var forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
    </script>
</div>

<div xmlns:th="http://www.thymeleaf.org" th:fragment="filterTable">
    <script>
        // Applies both the "hide inactive" checkbox and the search text: a row is shown only if it passes both
        function filterContracts() {
            const hideInactive = document.getElementById('filter').checked;
            const search = document.getElementById('search').value.toLowerCase();
            const rows = document.querySelectorAll('#contracts tbody tr');
            for (const row of rows) {
                const active = !row.classList.contains('inactive');
                const matches = Array.from(row.getElementsByTagName('td'))
                    .some(col => col.textContent.toLowerCase().includes(search));
                row.style.display = (active || !hideInactive) && matches ? '' : 'none';
            }
        }

        // the browser may restore the checkbox and search text when navigating back to this page
        window.addEventListener('pageshow', filterContracts);
    </script>
</div>
