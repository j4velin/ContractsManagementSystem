# Defaults of the app, loaded by ContractsApplication. application.properties and environment variables override them

# Backups to import (see ContractsCsv) can be larger than Spring Boot's default limit of 1 MB, as notes have no limit
# (2 MB are about 20000 contracts with short notes)
# Larger uploads are redirected to an error message by UploadSizeFilter
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Tomcat reads and discards the rest of a rejected upload up to this size, so that the browser gets the error message
# instead of a closed connection
server.tomcat.max-swallow-size=20MB
