# Defaults of the app, loaded by ContractsApplication. application.properties and environment variables override them

# Backups to import (see ContractsCsv) can be larger than Spring Boot's default limit of 1 MB, as notes have no limit.
# Files of up to 2 MB (about 20000 contracts with short notes) are accepted: the limit has 64 KB headroom for the rest of
# the upload request (CSRF token, form fields, multipart boundaries), and the error message shows it rounded down to
# whole megabytes. Larger uploads are redirected to that message by UploadSizeFilter.
# Both limits are the same: Tomcat checks the file size while Spring Security reads the form, where a rejected upload
# gets no response at all, so only UploadSizeFilter's check of the whole request may reject an upload
spring.servlet.multipart.max-file-size=2112KB
spring.servlet.multipart.max-request-size=2112KB
# Tomcat reads and discards the rest of a rejected upload up to this size, so that the browser gets the error message
# instead of a closed connection
server.tomcat.max-swallow-size=20MB
