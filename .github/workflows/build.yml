# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    # version tags like 1.2.0 (or v1.2.0) publish a Docker image, see the publish job
    tags: [ "[0-9]*", "v[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    
    - name: Build and test
      run: ./gradlew build

  # Builds the Docker image, starts it together with MongoDB and runs the end-to-end smoke test against it
  docker:

    runs-on: ubuntu-latest

    env:
      REMEMBER_ME_KEY: ci-smoke-test-key

    steps:
    - uses: actions/checkout@v7

    - name: Start app and database
      run: docker compose up --detach --build --wait

    - name: Smoke test
      run: scripts/smoke-test.sh http://localhost:8080

    - name: Remember-me key is picked up from the environment
      run: |
        if docker compose logs app | grep "remember-me.key is not set"; then
          echo "REMEMBER_ME_KEY did not reach the app"
          exit 1
        fi

    - name: Logs
      if: always()
      run: docker compose logs

    - name: Stop
      if: always()
      run: docker compose down --volumes

  # Publishes the Docker image to the GitHub Container Registry for version tags (e.g. 1.2.0), after the tests and
  # the smoke test passed for the tagged commit. Servers then only pull the finished image instead of building it
  publish:

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ build, docker ]

    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/j4velin/contractsmanagementsystem

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        # all tags, to find the newest published release
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags and labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        # 1.2.0 (or v1.2.0) is published as 1.2.0; "latest" is moved separately below
        tags: |
          type=semver,pattern={{version}}
        flavor: |
          latest=false

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # "latest" points to the newest release that has a published image. Every release run publishes its own version
    # tag (nothing is queued or dropped) and then only moves "latest" if no newer release is published: so a release
    # for an older line (1.0.1 after 1.1.0), a slower run, or a failed newer release never makes "latest" go back to
    # older code. Pre-releases like 2.0.0-rc1 never become "latest". Moving the tag only copies the manifest
    - name: Move latest to the newest published release
      run: |
        git fetch --tags --force --quiet
        version=${GITHUB_REF_NAME#v}
        newest=""
        # release versions from tags like 1.2.0 or v1.2.0, newest first
        for release in $(git tag --list | grep -E '^v?[0-9]+(\.[0-9]+)*$' | sed 's/^v//' | sort -rVu); do
          if docker buildx imagetools inspect "$IMAGE:$release" > /dev/null 2>&1; then
            newest=$release
            break
          fi
        done
        echo "newest published release: ${newest:-none}, this one: $version"
        if [ "$newest" = "$version" ]; then
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$version"
        else
          echo "latest stays as it is"
        fi
