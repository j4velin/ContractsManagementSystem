# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    # version tags like v1.2.0 publish a Docker image, see the publish job
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    
    - name: Build and test
      run: ./gradlew build

  # Builds the Docker image, starts it together with MongoDB and runs the end-to-end smoke test against it
  docker:

    runs-on: ubuntu-latest

    env:
      REMEMBER_ME_KEY: ci-smoke-test-key

    steps:
    - uses: actions/checkout@v7

    - name: Start app and database
      run: docker compose up --detach --build --wait

    - name: Smoke test
      run: scripts/smoke-test.sh http://localhost:8080

    - name: Remember-me key is picked up from the environment
      run: |
        if docker compose logs app | grep "remember-me.key is not set"; then
          echo "REMEMBER_ME_KEY did not reach the app"
          exit 1
        fi

    - name: Logs
      if: always()
      run: docker compose logs

    - name: Stop
      if: always()
      run: docker compose down --volumes

  # Publishes the Docker image to the GitHub Container Registry for version tags (e.g. v1.2.0), after the tests and
  # the smoke test passed for the tagged commit. Servers then only pull the finished image instead of building it
  publish:

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build, docker ]

    runs-on: ubuntu-latest

    # one publish at a time, so two releases pushed shortly after each other can't overwrite each other's tags
    concurrency:
      group: publish-image
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        # all tags, to find out whether this is the newest release
        fetch-depth: 0

    # Only the newest release may move "latest": e.g. v1.0.1 released after v1.1.0 must not make servers pulling
    # "latest" go back to the older code. Pre-releases like v2.0.0-rc1 never become "latest"
    - name: Check whether this is the newest release
      id: release
      run: |
        newest=$(git tag --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
        echo "newest release: $newest, this one: $GITHUB_REF_NAME"
        if [ "$newest" = "$GITHUB_REF_NAME" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags and labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/j4velin/contractsmanagementsystem
        # v1.2.0 is published as 1.2.0 and 1.2, and also as latest if it's the newest release
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
        flavor: |
          latest=false

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
